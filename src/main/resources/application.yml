server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${NC_DB_URL}
    username: ${NC_DB_USERNAME}
    password: ${NC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0          # no mantener conexiones abiertas sin uso
      maximum-pool-size: 5     # suficiente para un proyecto de este tamaño
      idle-timeout: 30000      # cerrar conexiones tras 30 s sin uso
      conection-timeout: 30000    # esperar hasta 30 s para obtener una conexión


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB 
      max-request-size: 5MB

  security:
    jwt:
      secret: ${NEGOCORE_JWT_KEY}
      expiration: 36000000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5175}

cloudinary:
  cloud-name: ${NC_CLOUDINARY_CLOUD_NAME}
  api-key: ${NC_CLOUDINARY_API_KEY}
  api-secret: ${NC_CLOUDINARY_API_SECRET}