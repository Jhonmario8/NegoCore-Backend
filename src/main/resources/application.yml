server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${NC_DB_URL}
    username: ${NC_DB_USERNAME}
    password: ${NC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${NEGOCORE_JWT_KEY}
      expiration: 36000000